name: Tadak
options:
  bundleIdPrefix: com.charging
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  HangulEngine:
    path: Packages/HangulEngine
  KeyboardCore:
    path: Packages/KeyboardCore
  KeyboardUI:
    path: Packages/KeyboardUI
  TadakDomain:
    path: Packages/TadakDomain
  TadakData:
    path: Packages/TadakData

targets:
  Tadak:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charging.tadak
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Tadak.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: TadakKeyboard
        embed: true
        codeSign: true
      - package: TadakDomain
        product: TadakDomain
      - package: TadakData
        product: TadakData

  TadakKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charging.tadak.keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: Keyboard/TadakKeyboard.entitlements
    dependencies:
      - package: HangulEngine
        product: HangulEngine
      - package: KeyboardCore
        product: KeyboardCore
      - package: KeyboardUI
        product: KeyboardUI
      - package: TadakDomain
        product: TadakDomain
      - package: TadakData
        product: TadakData

  # 실기 검증 하네스 (XCUITest) — docs/simulator-input-verification.md. 앱 타깃을 호스트로 실기에서 돈다.
  TadakUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charging.tadak.uitests
        TEST_TARGET_NAME: Tadak
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Tadak

schemes:
  Tadak:
    build:
      targets:
        Tadak: all
        TadakKeyboard: all
        TadakUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TadakUITests
    archive:
      config: Release
